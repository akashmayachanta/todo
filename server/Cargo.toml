[package]
name = "tasks-server"
description = "Tasks sync server: accounts, a REST API for tasks, and /sync for the apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tasks-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
axum = "0.8"
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.3"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
