<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Tasks</title>
		<style>html, body { overflow-x: clip; height: 100%; margin: 0; }</style>
		<script>
			// The saved theme before first paint; with no choice yet it follows the system.
			try {
				var saved = localStorage.getItem('theme-mode');
				var mode = saved === 'dark' || saved === 'light' ? saved
					: (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				var accent = localStorage.getItem('theme-accent');
				if (accent !== 'magenta' && accent !== 'green') accent = 'mono';
				document.documentElement.dataset.theme = mode + '-' + accent;
			} catch (e) {
				document.documentElement.dataset.theme = 'light-mono';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
