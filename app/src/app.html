<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Tasks</title>
		<!-- The app icon, for the browser copy's tab (static/, refreshed by `npm run icons`). -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
		<style>html, body { overflow-x: clip; height: 100%; margin: 0; }</style>
		<script>
			// The saved theme before first paint; with no choice yet it follows the system.
			try {
				var saved = localStorage.getItem('theme-mode');
				var mode = saved === 'dark' || saved === 'light' ? saved
					: (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				var accent = localStorage.getItem('theme-accent');
				if (accent !== 'magenta' && accent !== 'green' && accent !== 'blue') accent = 'mono';
				document.documentElement.dataset.theme = mode + '-' + accent;
				document.documentElement.dataset.font = localStorage.getItem('theme-font') === 'classic' ? 'classic' : 'system';
			} catch (e) {
				document.documentElement.dataset.theme = 'light-mono';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
