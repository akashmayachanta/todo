[workspace]
resolver = "2"
members = ["core", "server", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tasks-core = { path = "core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal"] }

[profile.release]
# No cross-crate LTO: every tauri build relinks the app (it re-embeds the
# frontend), and the whole-program LTO pass was most of that time. Each crate
# is still fully optimized; the exe is just somewhat bigger.
lto = false
strip = true
