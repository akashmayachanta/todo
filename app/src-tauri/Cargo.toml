[package]
name = "tasks-app"
description = "Tasks for Windows and Android: a local tasks DB that syncs with tasks-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The _lib suffix keeps the lib apart from the bin on Windows (cargo#8519).
name = "tasks_app_lib"
# rlib for the Windows exe, cdylib for Android. Add "staticlib" back to build
# for iOS; it made a 237 MB .lib on every Windows build.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tasks-core = { workspace = true, features = ["client"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Schedule::At takes a time::OffsetDateTime.
time = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
# Registers the app's toast identity (reminders.rs).
winreg = "0.56"
# Writes the Start Menu shortcut toasts take their name and icon from, and shows
# the toasts themselves (reminders.rs). Draws the count on the taskbar icon (widgets.rs).
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
